<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroSupply - Maintenance Manager</title>
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-icon"><i class="fa-solid fa-plane-departure"></i></div>
        <div class="logo-text"><h2>AeroSupply</h2><span>MRO Station</span></div>
      </div>
      <nav class="sidebar-nav">
        <button id="navApprovals" class="nav-item active" type="button"><i class="fa-solid fa-stamp"></i><span>Pending Approvals</span></button>
        <button id="navAudit" class="nav-item" type="button"><i class="fa-solid fa-clock-rotate-left"></i><span>Traceability & Audit Ledger</span></button>
      </nav>
      <div class="sidebar-user">
        <div class="user-avatar">MM</div>
        <div class="user-info"><span class="user-name">S. Manager</span><span class="user-role">Maintenance Manager</span></div>
        <button type="button" class="btn-logout" title="Switch Role" onclick="sessionStorage.removeItem('aerosupply.role'); location.href='login.html';"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </aside>

    <main class="main-viewport">
      <header class="app-topbar">
        <div class="topbar-title"><h1 id="viewTitle">Pending Approvals</h1></div>
        <div class="station-pill"><span class="status-dot"></span>CYUL Hangar - UTC</div>
      </header>

      <section id="viewApprovals" class="content-view" style="padding:1.5rem 2rem;">
        <div class="table-container">
          <table class="data-table">
            <thead><tr><th>Request ID</th><th>Target</th><th>Part</th><th>Urgency</th><th>Selected Quote</th><th style="text-align:center">Decision</th></tr></thead>
            <tbody id="approvalsTableBody"></tbody>
          </table>
        </div>
      </section>

      <section id="viewAudit" class="content-view hidden" style="padding:1.5rem 2rem;">
        <input id="auditSearch" type="text" class="form-control" placeholder="Search by Request ID, Tail, Part or Serial Number" onkeyup="renderAudit()" style="max-width:480px;margin-bottom:1rem;">
        <div id="auditTimeline" class="audit-timeline"></div>
      </section>
    </main>
  </div>

  <div id="modalReject" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3>Reject Requisition</h3>
      <p id="rejectReqId" class="mono"></p>
      <label class="form-label">Rejection Reason <span style="color:red">*</span></label>
      <textarea id="rejectReasonInput" class="form-control" rows="4" placeholder="Enter the mandatory technical reason"></textarea>
      <div class="modal-actions-split" style="margin-top:1rem;">
        <button type="button" class="btn-ghost" onclick="closeModal('modalReject')">Cancel</button>
        <button type="button" class="btn-danger-solid" onclick="confirmReject()">Confirm Rejection</button>
      </div>
    </div>
  </div>

  <script src="store.js"></script>
  <script src="manager.js"></script>
</body>
</html>
